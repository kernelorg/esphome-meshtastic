# Example: Ethernet-only Meshtastic node with the Meshtastic client APIs, Home Assistant entities,
# device telemetry and an MQTT gateway.
# Board: Olimex ESP32-PoE2 (LAN8720) + Seeed Wio-SX1262 on EXT1, region EU_868, preset SHORT_FAST
#
# Clients:
#   - Meshtastic web client over HTTP (port 80): run it locally
#     (docker run -p 8080:8080 ghcr.io/meshtastic/web), open http://localhost:8080, connect to the node's IP
#   - Home Assistant Meshtastic integration, `meshtastic --host <ip>`, apps: TCP port 4403
# Give the node a fixed IP (DHCP reservation): clients connect by address.
#
# secrets.yaml:
#   api_key: "<32-byte base64>"            # esphome API encryption key
#   node_private_key: "<32-byte base64>"   # meshtastic node keys (Curve25519)
#   node_public_key: "<32-byte base64>"
#   private_channel_psk: "<16/32-byte base64>"

esphome:
  name: meshtastic-api
  friendly_name: Meshtastic API

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_MBEDTLS_CCM_C: y

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

psram:

# No wifi: block needed; the component builds Ethernet-only
ethernet:
  type: LAN8720
  clk:
    mode: CLK_OUT
    pin: GPIO0
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

# Let the Meshtastic apps find the node on the LAN (they browse _meshtastic._tcp, like on
# Meshtastic devices). mDNS stays within one subnet/VLAN.
mdns:
  services:
    - service: "_meshtastic"
      protocol: "_tcp"
      port: 4403             # = client_api.tcp_port
      txt:
        shortname: ESPH      # = short_name of node 0
        id: "!xxxxxxxx"      # node id, see "Owner ID" in the log
        pio_env: esphome

time:
  - platform: sntp

# MQTT gateway (here: the public broker of the Polish community, see https://loranet.pl/mqtt).
# Only Meshtastic packets may go to a public broker: no discovery, status, logs or IP,
# and every entity below has state_topic: null.
mqtt:
  broker: loranet.pl
  port: 1883
  discovery: false
  discover_ip: false
  log_topic: null
  birth_message: null
  will_message: null
  shutdown_message: null
  reboot_timeout: 0s       # never reboot the node when the broker is unreachable

external_components:
  - source: github://kernelorg/esphome-meshtastic@v4
    components: [meshtastic]
    refresh: 24h

# ---------------------------------------------------------------------------
# LoRa: Wio-SX1262
# ---------------------------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO35

sx126x:
  id: lora_radio
  hw_version: sx1262
  modulation: LORA
  rf_switch: true          # DIO2 drives the antenna switch
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  cs_pin: GPIO5
  rst_pin: GPIO4
  busy_pin: GPIO32
  dio1_pin: GPIO33
  pa_power: 14             # dBm; mind the EIRP limit of your band and antenna gain
  frequency: 869525000     # EU_868
  # SHORT_FAST preset
  spreading_factor: 7
  bandwidth: 250_0kHz
  coding_rate: CR_4_5
  crc_enable: true
  rx_start: true
  sync_value: [0x20, 0xb0] # Meshtastic sync word
  preamble_size: 16

# Wio-SX1262 RF_SW: HIGH = RX path
output:
  - platform: gpio
    id: rf_sw_out
    pin:
      number: GPIO15
      ignore_strapping_warning: true

switch:
  - platform: output
    id: rf_sw
    output: rf_sw_out
    restore_mode: ALWAYS_ON
    internal: true
    state_topic: null

# ---------------------------------------------------------------------------
# Meshtastic
# ---------------------------------------------------------------------------
meshtastic:
  - id: mesh_node
    lora: lora_radio
    hw_model: 39             # DIY_V1
    hop_limit: 3
    role: CLIENT             # relay packets
    slot_time: 9ms           # SHORT_FAST
    exclude_pki: false
    ignore_mqtt: true
    ok_to_mqtt: true

    client_api:
      port: 80               # HTTP API (web client), 0 = off
      tcp_port: 4403         # TCP API (HA integration, CLI, apps), 0 = off
      region: EU_868         # reported to clients only
      modem_preset: SHORT_FAST
    telemetry_interval: 30min  # own DeviceMetrics to the mesh; clients get them every minute
    mqtt_root_topic: msh/PL

    position:
      latitude: 50.0614      # example coordinates
      longitude: 19.9366
      altitude: 220
      broadcast_interval: 1h

    channels:
      - name: ShortFast
        psk: "AQ=="          # default key
        position_precision: 13   # ~3 km on the public channel (and on MQTT maps)
        uplink: true         # MQTT gateway: publish this channel
      - name: private
        psk: !secret private_channel_psk   # no uplink: stays off MQTT

    nodes:
      - node_number: 0       # this node
        name: "ESPHome Mesh"
        short_name: "ESPH"
        private_key: !secret node_private_key
        public_key: !secret node_public_key
        broadcast_interval: 3h
      # Other nodes are learned from NodeInfo; list a peer here to pin its key:
      # - node_number: 0x12345678
      #   name: "Peer"
      #   short_name: "PEER"
      #   public_key: "<32-byte base64>"

    # Every received text message, also repeated ones -> Home Assistant event
    on_text_message:
      - homeassistant.event:
          event: esphome.mesh_text
          data:
            sender: !lambda return sender;
            channel: !lambda return channel;   # "" = direct message
            text: !lambda return text;

# ---------------------------------------------------------------------------
# Home Assistant: received text, destination and send
# ---------------------------------------------------------------------------
text_sensor:
  - platform: meshtastic
    type: last_message
    name: "Mesh last message"
    state_topic: null        # not to the MQTT broker
  - platform: meshtastic
    type: last_sender
    name: "Mesh last sender"
    state_topic: null        # not to the MQTT broker
  - platform: meshtastic
    type: last_channel       # "direct" for direct messages
    name: "Mesh last channel"
    state_topic: null        # not to the MQTT broker

select:
  - platform: meshtastic     # channels, then nodes from nodes:
    name: "Mesh destination"
    state_topic: null        # not to the MQTT broker

text:
  - platform: meshtastic     # setting a value sends it to the selected destination
    name: "Mesh send"
    state_topic: null        # not to the MQTT broker
